name: Sync content

# Moves content.lock.json to each source's latest commit, rebuilds bundles,
# and deploys — with no human step. The deploy itself (pages.yml) stays
# offline; only this workflow touches the network.
#
# Triggers:
#   repository_dispatch  a source repo merged to main (reasonfrom-kit action)
#   schedule             every 3h: new YouTube uploads, missed dispatches,
#                        scheduled lessons
#   workflow_dispatch    by hand
on:
  repository_dispatch:
    types: [reasonfrom-source-updated]
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

# main is protected: a change lands only through a PR whose 'verify' check
# passes. Pushes and PRs made with the built-in token do not trigger other
# workflows, but a manual dispatch does. So the bot opens its PR, dispatches
# the real verify.yml on its branch (an independent run, same gates, same
# check name), enables auto-merge, waits for GitHub to merge, then dispatches
# the deploy. No personal token is involved; protection on main is unchanged.
permissions:
  contents: write        # push the bot branch
  pull-requests: write   # open the PR, enable auto-merge
  actions: write         # dispatch verify.yml and pages.yml
  issues: write          # one "Publish failing" issue, opened and closed automatically

concurrency:
  group: sync-content
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      GH_TOKEN: ${{ github.token }}
      ISSUE_TITLE: "Publish failing"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Public check, fetch, build, validate, claims, collapse floor.
      # A dispatched source is synced alone; schedule and manual sync all.
      # The payload is untrusted input: it arrives via env (never interpolated
      # into the script), must look like owner/name, and sync-bundles only
      # ever acts on repos already in src/data/content-sources.json.
      - name: Sync bundles
        env:
          PAYLOAD_REPO: ${{ github.event.client_payload.repo }}
        run: |
          src="$PAYLOAD_REPO"
          if [ -n "$src" ] && ! [[ "$src" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::ignoring malformed client_payload.repo"; exit 1
          fi
          if [ -n "$src" ]; then
            node scripts/sync-bundles.mjs --update --source "$src"
          else
            node scripts/sync-bundles.mjs --update
          fi

      # New uploads, Shorts detection, "New video" notices. Soft: a YouTube
      # outage must not block course updates; it shows as a warning instead.
      - name: Sync videos
        if: github.event_name != 'repository_dispatch'
        continue-on-error: true
        run: node scripts/sync-videos.mjs

      # Same gates as the deploy, run before anything is committed.
      - name: Type-check
        run: npm run check
      - name: Build
        run: npm run build
      - name: Check internal links
        run: node scripts/check-links.mjs

      - name: Publish through a verified PR
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git add bundles content.lock.json src/data/launches.json src/content/videos
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          summary=$(node -e '
            const l = require("./content.lock.json");
            console.log(Object.entries(l.sources).map(([r, s]) => `${r}@${s.sha.slice(0, 7)}`).join(", "));')
          git commit -q -m "Sync content: ${summary}"
          git push -q -f origin HEAD:refs/heads/bot/sync-content
          sha=$(git rev-parse HEAD)

          n=$(gh pr list --head bot/sync-content --state open --json number --jq '.[0].number // empty')
          if [ -z "$n" ]; then
            gh pr create --base main --head bot/sync-content --title "Sync content" \
              --body "Automatic content sync: ${summary}. verify runs on this branch; the PR merges itself when it passes. Run: $RUN_URL"
            n=$(gh pr list --head bot/sync-content --state open --json number --jq '.[0].number')
          fi

          # An independent verify run on exactly this commit (the required check).
          gh workflow run verify.yml --ref bot/sync-content
          gh pr merge "$n" --auto --merge

          # Wait (up to 20 min) for GitHub to merge it, then deploy.
          for i in $(seq 1 80); do
            state=$(gh pr view "$n" --json state --jq .state)
            [ "$state" = "MERGED" ] && break
            [ "$state" = "CLOSED" ] && { echo "::error::PR #$n was closed without merging"; exit 1; }
            sleep 15
          done
          if [ "$state" != "MERGED" ]; then
            echo "::error::PR #$n did not merge within 20 minutes (verify failing or still queued). Nothing was deployed."
            exit 1
          fi
          gh workflow run pages.yml --ref main
          echo "Published ${sha:0:7} via PR #$n; deploy dispatched."

      - name: Close failure issue
        if: success()
        run: |
          n=$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue close "$n" --comment "Recovered in ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."
          fi

      - name: Open or update failure issue
        if: failure()
        env:
          TRIGGER: ${{ github.event_name }}
          PAYLOAD_REPO: ${{ github.event.client_payload.repo }}
        run: |
          run="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body="Content sync failed, so reasonfrom.com was **not** changed. The live site still serves the last good version.

          Run: $run
          Trigger: $TRIGGER $PAYLOAD_REPO

          This issue closes itself on the next successful sync."
          n=$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "Still failing: $run"
          else
            gh issue create --title "$ISSUE_TITLE" --body "$body"
          fi
