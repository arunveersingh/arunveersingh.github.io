name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7

      # Attempts to turn Pages on if it is off. This often fails, because the
      # workflow's GITHUB_TOKEN is an App token and GitHub does not grant App
      # tokens permission to enable Pages — that needs a repo admin or a PAT.
      # Harmless when Pages is already on, so it stays as a best effort.
      - uses: actions/configure-pages@v6
        continue-on-error: true
        with:
          enablement: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Deliberately no `npm run sync` here. Content lives in the repo, so the
      # deploy is deterministic and offline: no YouTube/GitHub calls, no rate
      # limits, no token. It also removes a real outage mode — YouTube's RSS
      # window only returns the latest 15 items per feed, so a rotation could
      # delete a curated video mid-deploy and fail the build.
      # Refresh content deliberately with `npm run sync` and commit the diff.
      #
      # Course and skills content comes from bundles/ (pinned by
      # content.lock.json). `npm run build` materializes them offline first.
      # sync-content.yml is what moves the pins; it commits, then dispatches
      # this workflow.

      # Type-checks pages, layouts, and content collection schemas. `npm run
      # check` existed but nothing ran it, so schema drift only surfaced locally.
      - name: Type-check
        run: npm run check

      - name: Build
        run: npm run build

      # Every internal href/src must resolve to a built file.
      - name: Check internal links
        run: node scripts/check-links.mjs

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
