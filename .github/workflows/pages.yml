name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Deliberately no `npm run sync` here. Content lives in the repo, so the
      # deploy is deterministic and offline: no YouTube/GitHub calls, no rate
      # limits, no token. It also removes a real outage mode — YouTube's RSS
      # window only returns the latest 15 items per feed, so a rotation could
      # delete a curated video mid-deploy and fail the build.
      # Refresh content deliberately with `npm run sync` and commit the diff.

      # Type-checks pages, layouts, and content collection schemas. `npm run
      # check` existed but nothing ran it, so schema drift only surfaced locally.
      - name: Type-check
        run: npm run check

      - name: Build
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
