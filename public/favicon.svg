<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Reason From mark: a turnstile, the logic symbol for "derives from".
    Same geometry as src/components/Mark.astro, on a near-black tile so it
    holds up against any tab strip in either theme. Colours are the site's own
    dark-theme canvas (#0b0a09) and accent (#ff7a17).
  -->
  <rect width="32" height="32" rx="7" fill="#0b0a09"/>
  <rect x="8" y="7" width="3.75" height="18" rx="0.6" fill="#ff7a17"/>
  <rect x="8" y="14.125" width="16.5" height="3.75" rx="0.6" fill="#ff7a17"/>
</svg>
